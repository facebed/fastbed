name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          # Publish only the architecture covered by the current release gates.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fastbed-amd64
          cache-to: type=gha,mode=max,scope=fastbed-amd64

      - name: Smoke-test published image
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          name=fastbed-published-smoke
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$PUBLISHED_IMAGE"
          docker run --detach --name "$name" \
            --user 65532:65532 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 32 \
            --ulimit core=0:0 \
            --stop-timeout 90 \
            -p 127.0.0.1::9812 \
            "$PUBLISHED_IMAGE" --workers 2

          ready=false
          for attempt in $(seq 1 120); do
            : "$attempt"
            port=$(docker port "$name" 9812/tcp | sed -n 's/.*://p' | head -n 1)
            if [ -n "$port" ] && \
               curl --noproxy '*' --fail --silent --show-error \
                 "http://127.0.0.1:${port}/healthz" >health.json; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done
          [ "$ready" = true ]
          grep -F '"status": "ok"' health.json >/dev/null

          curl --noproxy '*' --fail --silent --show-error \
            "http://127.0.0.1:${port}/favicon.ico" >favicon.ico
          cmp assets/favicon.ico favicon.ico
          curl --noproxy '*' --fail --silent --show-error \
            "http://127.0.0.1:${port}/banner.png" >banner.png
          cmp assets/banner.png banner.png
          curl --noproxy '*' --fail --silent --show-error \
            "http://127.0.0.1:${port}/" >root.html
          grep -F 'facebed by pi.kt' root.html >/dev/null

          curl --noproxy '*' --silent --show-error \
            --user-agent 'Mozilla/5.0' \
            --dump-header redirect.headers \
            --output redirect.body \
            "http://127.0.0.1:${port}/posts/123"
          grep -F ' 302 ' redirect.headers >/dev/null
          grep -Fi 'location: https://www.facebook.com/posts/123' \
            redirect.headers >/dev/null

          docker stop --time 90 "$name" >/dev/null
          [ "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0 ]

      - name: Record published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Published container'
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            printf 'Tags:\n\n%s\n' "$TAGS"
          } >>"$GITHUB_STEP_SUMMARY"
